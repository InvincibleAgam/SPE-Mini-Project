# Reverse proxy / load balancer in front of the calculator replicas.

# Use Docker's embedded DNS and re-resolve "calculator" every 5s. When the pipeline
# redeploys, the calculator containers get new IPs; without this nginx would keep
# the old IPs from startup and return 502 until it was restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # nginx's own liveness check, used by the Compose health check
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        # A variable forces per-request DNS lookup (see resolver above). "calculator"
        # resolves to every replica, and nginx spreads requests across them.
        set $calculator_upstream http://calculator:8080;
        proxy_pass $calculator_upstream;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        # If a replica is unreachable (e.g. mid-redeploy), retry the request on another one
        proxy_next_upstream error timeout;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Shows which replica served the request: curl -i to see load balancing
        add_header X-Served-By $upstream_addr always;
    }
}
