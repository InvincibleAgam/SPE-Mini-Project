spring:
  application:
    name: calculator-devops
  jackson:
    generator:
      # Print 100 rather than 1E+2 in JSON responses
      write-bigdecimal-as-plain: true

server:
  port: 8080
  # Finish in-flight requests before stopping when Compose/Docker sends SIGTERM
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Adds /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: '@project.name@'
    version: '@project.version@'
